schema_version: 1
case: msre_first_criticality
title: MSRE first criticality geometry/material uncertainty inputs
status: illustrative_harness_assumption_backed
notes:
  - Current entries exercise the solver-backed UQ workflow on the illustrative harness.
  - They are not sufficient for benchmark-ready uncertainty coverage until source-indexed geometry and material reconstruction is complete.
parameters:
  - id: fuel_salt_density
    label: Fuel-salt density scale
    category: material
    operation: material_density_relative
    material: fuel_salt
    units: relative
    distribution: normal
    mean: 1.0
    sigma_fraction: 0.0102
    bounds: [0.96, 1.04]
    source_status: assumption_backed
    source_backed: false
    required_for_benchmark_ready: true
    source_refs: [source-dossier]
    note: Uses the current case material-property uncertainty as an illustrative input; not IRPhEP source-backed.
  - id: graphite_density
    label: Graphite density scale
    category: material
    operation: material_density_relative
    material: graphite
    units: relative
    distribution: normal
    mean: 1.0
    sigma_fraction: 0.005
    bounds: [0.98, 1.02]
    source_status: assumption_backed
    source_backed: false
    required_for_benchmark_ready: true
    source_refs: [osti-2020-report]
    note: Graphite density is a known bias source, but the current open harness has not encoded benchmark-grade values.
  - id: u235_atom_fraction

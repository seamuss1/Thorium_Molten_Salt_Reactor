name: Engineering task
description: Stage implementation, refactor, test, tooling, or repo maintenance work.
title: "[Task]: "
labels:
  - type:task
  - needs:triage
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - cli
        - cases
        - geometry
        - physics
        - transport
        - depletion
        - reporting
        - benchmarks
        - qa
        - docs
        - infra
        - integrations
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be true after this work lands?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Include likely files, modules, commands, or screens.
      placeholder: |
        In scope:
        - 

        Out of scope:
        - 
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Prefer repo wrappers from AGENTS.md.
      placeholder: |
        - .\scripts\Run-Tests.cmd ...
        - npm.cmd run build from web/ui
        - Manual clickthrough: Dashboard, Cases, Builder, Runs, Science, 3D
  - type: dropdown
    id: size
    attributes:
      label: Expected size
      options:
        - S
        - M
        - L
        - unknown
    validations:
      required: true

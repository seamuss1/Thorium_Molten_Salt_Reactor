name: Sync labels

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create or update labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const { owner, repo } = context.repo;

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const existingByName = new Map(existing.map((label) => [label.name, label]));

            const created = [];
            const updated = [];

            for (const label of labels) {
              const current = existingByName.get(label.name);
              if (!current) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                created.push(label.name);
                continue;
              }

              if (current.color !== label.color || (current.description || '') !== label.description) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                updated.push(label.name);
              }
            }

            await core.summary
              .addHeading('Label sync complete')
              .addRaw(`Created: ${created.length ? created.join(', ') : 'none'}\n\n`)
              .addRaw(`Updated: ${updated.length ? updated.join(', ') : 'none'}\n`)
              .write();

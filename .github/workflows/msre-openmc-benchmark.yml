name: MSRE OpenMC benchmark

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional results run id. Defaults to the GitHub run id.
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Tests, QA, and dry-run report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CASE_NAME: msre_first_criticality
      PREFLIGHT_RUN_ID: msre-preflight-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker runtime
        shell: bash
        run: |
          docker version
          docker compose version

      - name: Run Python test suite in app container
        shell: bash
        run: docker compose run --build --rm app python -m pytest

      - name: Run QA traceability check
        shell: bash
        run: docker compose run --rm app python -m thorium_reactor.cli qa --format json

      - name: Generate dry-run MSRE report bundle
        shell: bash
        run: |
          docker compose run --rm app python -m thorium_reactor.cli run "${CASE_NAME}" \
            --run-id "${PREFLIGHT_RUN_ID}" --no-solver
          docker compose run --rm app python -m thorium_reactor.cli report "${CASE_NAME}" \
            --run-id "${PREFLIGHT_RUN_ID}"

      - name: Upload dry-run preflight bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msre-first-criticality-preflight-${{ env.PREFLIGHT_RUN_ID }}
          path: results/${{ env.CASE_NAME }}/${{ env.PREFLIGHT_RUN_ID }}
          if-no-files-found: warn
          retention-days: 14

  msre-first-criticality:
    name: MSRE first criticality
    runs-on: ubuntu-latest
    needs: preflight
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 360
    env:
      CASE_NAME: msre_first_criticality
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve run id
        shell: bash
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          run_id="${REQUESTED_RUN_ID}"
          if [[ -z "$run_id" ]]; then
            run_id="msre-first-criticality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          if [[ ! "$run_id" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::run_id may only contain letters, numbers, dots, underscores, and hyphens."
            exit 1
          fi
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BUNDLE_DIR=results/${CASE_NAME}/${run_id}" >> "$GITHUB_ENV"

      - name: Show Docker runtime
        shell: bash
        run: |
          docker version
          docker compose version

      - name: Run solver-backed benchmark in OpenMC container
        shell: bash
        run: |
          docker compose run --build --rm openmc \
            python -m thorium_reactor.cli benchmark "${CASE_NAME}" \
              --run-id "${RUN_ID}"

      - name: Summarize bundle
        if: always()
        shell: bash
        run: |
          {
            echo "### MSRE first-criticality OpenMC benchmark"
            echo
            echo "- Case: \`${CASE_NAME}\`"
            echo "- Run ID: \`${RUN_ID}\`"
            echo "- Bundle: \`${BUNDLE_DIR}\`"
            echo
            if [[ -f "${BUNDLE_DIR}/report.md" ]]; then
              echo "#### Readiness lines"
              grep -E "Benchmark ready|Benchmark quality stage|Neutronics evidence|OpenMC artifact blocker" "${BUNDLE_DIR}/report.md" || true
            else
              echo "Report was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msre-first-criticality-openmc-${{ env.RUN_ID }}
          path: ${{ env.BUNDLE_DIR }}
          if-no-files-found: warn
          retention-days: 30

name: CI

# Fast PR gate: lint, typecheck, Python tests, and the frontend build/tests,
# all without Docker. The Docker-based OpenMC workflow stays as the deep,
# mostly dispatch-triggered path (see msre-openmc-benchmark.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

      - name: mypy
        run: mypy

  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .

      - name: Run test suite
        run: pytest -m "not slow and not hardware" --cov --cov-report=term

      - name: QA traceability check
        run: python -m thorium_reactor.cli qa --format json

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes tsc --noEmit)
        run: npm run build

      - name: Unit tests
        run: npm test

  windows-workflows:
    name: Windows wrappers and job lifecycle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked test runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps --no-build-isolation -e .
      - name: Verify wrappers, solver outcomes and process ownership
        run: pytest tests/test_web_wrappers.py tests/test_audit_regressions.py -q

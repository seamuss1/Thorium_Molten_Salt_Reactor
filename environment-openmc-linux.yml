# Exploratory host environment. For the reproducible solver use the digest-pinned
# openmc Compose service; Conda's compiled solver closure is not locked here.
name: thorium-reactor-openmc
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - openmc=0.15.3
  - pip:
      - --require-hashes -r requirements.lock

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thorium-reactor"
version = "0.1.0"
description = "Python-first reactor design platform for TMSR-LF1-inspired neutronics, BOP, geometry, and reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Thorium Molten Salt Reactor Contributors" }
]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "Pillow>=10.0",
  "scipy>=1.12",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
openmc = [
  "openmc>=0.14; platform_system != 'Windows'"
]
gpu-intel = [
  "torch>=2.7"
]
# Blender headless rendering path in geometry.exporters. Not installable from
# PyPI on every platform; declared so the import is not undeclared magic.
render-blender = [
  "bpy>=4.0"
]

[project.scripts]
reactor = "thorium_reactor.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"thorium_reactor.economics" = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider -ra --strict-markers"
markers = [
  "slow: tests that spawn subprocesses or take more than a few seconds",
  "hardware: tests that require specific local hardware (GPU/OpenCL)",
  "integration: tests that exercise several subsystems end to end",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["archive", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "SIM108",  # ternaries are not always clearer than if/else here
  # --- Deferred to named refactor-plan phases, not permanent exemptions. ---
  "B905",    # zip(strict=): changes behavior on ragged input; audit in Phase 3
  "RUF046",  # int(round(x)): the int() cast forces a JSON-serializable Python
             # int out of numpy scalars, so removing it is not safe here
  "SIM105",  # contextlib.suppress: these are the except/pass sites the plan
             # bans outright in Phase 2 — they get deleted, not rewritten
  "SIM102",  # one site in reports.py, rewritten in Phase 3
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF043"]

[tool.mypy]
python_version = "3.11"
files = ["src/thorium_reactor"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
# Permissive baseline: the plan ratchets these on package by package as
# typed models land (refactor plan Phase 4).
disallow_untyped_defs = false
check_untyped_defs = false

# Typing debt list. Every module below fails mypy today; the 30 modules NOT
# listed are clean and are gated, so new code and regressions are caught.
# This list may only ever shrink — Phase 4 of docs/refactor-plan.md burns it
# down, and several entries disappear with the Phase 0.5 deletions.
[[tool.mypy.overrides]]
module = [
  "thorium_reactor.benchmarking",
  "thorium_reactor.cli",
  "thorium_reactor.depletion.matrix",
  "thorium_reactor.flow.primary_system",
  "thorium_reactor.flow.properties",
  "thorium_reactor.flow.reduced_order",
  "thorium_reactor.geometry.exporters",
  "thorium_reactor.geometry.molten_salt_reactor",
  "thorium_reactor.msd_tp",
  "thorium_reactor.neutronics.workflows",
  "thorium_reactor.paths",
  "thorium_reactor.physics_core",
  "thorium_reactor.precursors",
  "thorium_reactor.property_audit",
  "thorium_reactor.qa",
  "thorium_reactor.reporting.plots",
  "thorium_reactor.reporting.reports",
  "thorium_reactor.runtime_context",
  "thorium_reactor.transient",
  "thorium_reactor.transient_sweep",
  "thorium_reactor.transport.rzdg",
  "thorium_reactor.uncertainty.sweep",
  "thorium_reactor.web.jobs",
  "thorium_reactor.web.permissions",
  "thorium_reactor.web.repository",
]
ignore_errors = true

[tool.coverage.run]
source = ["src/thorium_reactor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
